<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تولدت مبارک 🎂</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #d9c2ff);
            color: #5a315d;
        }

        .box {
            background: rgba(255,255,255,0.8);
            padding: 40px 25px;
            border-radius: 25px;
            width: 80%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 20px;
            line-height: 2;
        }

        button {
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            background: #ff6fa8;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        #message {
            display: none;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>🎂 تولدت مبارک! 🎉</h1>

        <p>
            امروز یه روز خاصه چون تو به دنیا اومدی 💗
            <br>
            امیدوارم امسال پر از اتفاقای قشنگ برات باشه ✨
        </p>

        <button onclick="showMessage()">یه سورپرایز دارم 🎁</button>

        <div id="message">
            <h2>💖 سورپرایزززز! 💖</h2>
            <p>
                امیدوارم همیشه بخندی و به چیزایی که دوست داری برسی 🌸
                <br>
                تولدت مبارک بهترین! 🥳🎈
            </p>
        </div>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").style.display = "block";
        }
    </script>

</body>
</html>
